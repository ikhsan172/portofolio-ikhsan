<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Laravel hexagonal cube logo redrawn at 128x128 -->
  <defs>
    <linearGradient id="lara-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF4F33"/>
      <stop offset="100%" stop-color="#FF2D20"/>
    </linearGradient>
  </defs>
  <!-- Left face of cube -->
  <polygon points="20,42 64,16 64,74 20,100" fill="#FF2D20" opacity="0.85"/>
  <!-- Right face of cube -->
  <polygon points="64,16 108,42 108,100 64,74" fill="#FF5A4D"/>
  <!-- Top face of cube -->
  <polygon points="20,42 64,16 108,42 64,68" fill="#FF8077"/>
  <!-- Inner diamond highlight -->
  <polygon points="64,38 82,48 82,68 64,78 46,68 46,48" fill="#FF2D20"/>
</svg>
