<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <!-- Background glow -->
  <defs>
    <radialGradient id="bodyGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#cc1111"/>
      <stop offset="100%" stop-color="#6b0000"/>
    </radialGradient>
    <radialGradient id="faceGlow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#dd1515"/>
      <stop offset="100%" stop-color="#7a0000"/>
    </radialGradient>
    <filter id="lensGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="webGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Body/torso (dark navy suit - MCU Iron Spider style) -->
  <path d="M30 500 Q30 380 50 320 Q100 270 200 260 Q300 270 350 320 Q370 380 370 500Z" fill="#0a0a1a"/>

  <!-- Red chest spider emblem -->
  <g transform="translate(200,360)">
    <!-- Spider body -->
    <ellipse cx="0" cy="0" rx="12" ry="16" fill="#cc0000"/>
    <!-- Spider legs left -->
    <line x1="-12" y1="-8" x2="-40" y2="-25" stroke="#cc0000" stroke-width="3" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="-42" y2="0" stroke="#cc0000" stroke-width="3" stroke-linecap="round"/>
    <line x1="-12" y1="8" x2="-38" y2="22" stroke="#cc0000" stroke-width="3" stroke-linecap="round"/>
    <!-- Spider legs right -->
    <line x1="12" y1="-8" x2="40" y2="-25" stroke="#cc0000" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="0" x2="42" y2="0" stroke="#cc0000" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="8" x2="38" y2="22" stroke="#cc0000" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Suit web lines on torso -->
  <g stroke="#1a0000" stroke-width="1.2" opacity="0.55" filter="url(#webGlow)">
    <!-- Vertical center -->
    <line x1="200" y1="270" x2="200" y2="500"/>
    <!-- Web arcs body -->
    <path d="M100 300 Q200 285 300 300" fill="none"/>
    <path d="M80 350 Q200 330 320 350" fill="none"/>
    <path d="M60 400 Q200 375 340 400" fill="none"/>
    <path d="M40 450 Q200 420 360 450" fill="none"/>
    <!-- Diagonals -->
    <line x1="50" y1="270" x2="200" y2="500"/>
    <line x1="350" y1="270" x2="200" y2="500"/>
    <line x1="130" y1="270" x2="50" y2="500"/>
    <line x1="270" y1="270" x2="350" y2="500"/>
  </g>

  <!-- Neck -->
  <ellipse cx="200" cy="255" rx="38" ry="18" fill="url(#bodyGlow)"/>

  <!-- Head (red mask) -->
  <ellipse cx="200" cy="165" rx="110" ry="130" fill="url(#faceGlow)"/>

  <!-- Dark blue/black stripe down center face -->
  <path d="M200 50 Q215 100 218 165 Q215 220 200 255 Q185 220 182 165 Q185 100 200 50Z" fill="rgba(0,0,0,0.18)"/>

  <!-- Web pattern on face -->
  <g stroke="#880000" stroke-width="1" opacity="0.7" filter="url(#webGlow)">
    <!-- Radial web from eye area -->
    <!-- Left eye center ~(150, 140) -->
    <line x1="150" y1="140" x2="100" y2="90"/>
    <line x1="150" y1="140" x2="90" y2="140"/>
    <line x1="150" y1="140" x2="100" y2="190"/>
    <line x1="150" y1="140" x2="200" y2="50"/>
    <line x1="150" y1="140" x2="200" y2="100"/>
    <line x1="150" y1="140" x2="200" y2="160"/>
    <!-- Right eye center ~(250, 140) -->
    <line x1="250" y1="140" x2="300" y2="90"/>
    <line x1="250" y1="140" x2="310" y2="140"/>
    <line x1="250" y1="140" x2="300" y2="190"/>
    <line x1="250" y1="140" x2="200" y2="50"/>
    <line x1="250" y1="140" x2="200" y2="100"/>
    <line x1="250" y1="140" x2="200" y2="160"/>
    <!-- Concentric arcs left -->
    <path d="M100 90 Q125 65 150 60" fill="none"/>
    <path d="M90 120 Q118 85 155 78" fill="none"/>
    <path d="M90 150 Q115 110 155 100" fill="none"/>
    <path d="M100 180 Q122 155 152 148" fill="none"/>
    <!-- Concentric arcs right -->
    <path d="M300 90 Q275 65 250 60" fill="none"/>
    <path d="M310 120 Q282 85 245 78" fill="none"/>
    <path d="M310 150 Q285 110 245 100" fill="none"/>
    <path d="M300 180 Q278 155 248 148" fill="none"/>
    <!-- Nose/chin area arcs -->
    <path d="M152 195 Q200 218 248 195" fill="none"/>
    <path d="M155 218 Q200 240 245 218" fill="none"/>
  </g>

  <!-- LEFT EYE - large white almond shape with subtle tilt -->
  <g filter="url(#lensGlow)">
    <path d="M100 125 Q130 100 160 110 Q182 118 183 140 Q182 163 160 170 Q130 180 100 155 Q82 143 100 125Z" fill="white"/>
    <!-- Eye reflection / inner detail -->
    <path d="M110 128 Q132 110 158 118 Q175 124 176 140 Q175 158 158 164 Q132 172 110 152 Q97 143 110 128Z" fill="rgba(220,235,255,0.9)"/>
    <!-- Glint -->
    <ellipse cx="135" cy="128" rx="10" ry="7" fill="rgba(255,255,255,0.7)" transform="rotate(-15,135,128)"/>
  </g>

  <!-- RIGHT EYE - mirror -->
  <g filter="url(#lensGlow)">
    <path d="M300 125 Q270 100 240 110 Q218 118 217 140 Q218 163 240 170 Q270 180 300 155 Q318 143 300 125Z" fill="white"/>
    <path d="M290 128 Q268 110 242 118 Q225 124 224 140 Q225 158 242 164 Q268 172 290 152 Q303 143 290 128Z" fill="rgba(220,235,255,0.9)"/>
    <ellipse cx="265" cy="128" rx="10" ry="7" fill="rgba(255,255,255,0.7)" transform="rotate(15,265,128)"/>
  </g>

  <!-- Chin bottom shadow -->
  <ellipse cx="200" cy="280" rx="90" ry="15" fill="rgba(0,0,0,0.35)"/>

  <!-- Overall glow aura -->
  <ellipse cx="200" cy="200" rx="130" ry="155" fill="none" stroke="#ff2222" stroke-width="2" opacity="0.25"/>
</svg>

