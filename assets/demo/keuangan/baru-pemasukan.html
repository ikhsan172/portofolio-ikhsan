<script>
    const sb = document.getElementById('sidebar'), bd = document.getElementById('backdrop');
    const toggle = () => { sb.classList.toggle('-translate-x-full'); bd.classList.toggle('hidden'); };
    document.getElementById('menuBtn')?.addEventListener('click', toggle);
    bd.addEventListener('click', toggle);
</script>
<script>
const sel = document.getElementById('category_id');
function syncCategories() {
    const t = document.querySelector('input[name=type]:checked')?.value;
    [...sel.options].forEach(o => {
        if (!o.value) return;
        const hide = o.dataset.type !== t;
        o.hidden = hide; o.disabled = hide;
    });
    const cur = sel.selectedOptions[0];
    if (cur && cur.value && cur.dataset.type !== t) sel.value = '';
}
document.querySelectorAll('input[name=type]').forEach(r => r.addEventListener('change', syncCategories));
syncCategories();
</script>
