    <h1 class="mb-6 text-2xl font-semibold">Catat transaksi barang</h1>

    <form method="POST" action="#" class="card space-y-5">
        <input type="hidden" name="_token" value="demo" autocomplete="off">
        <fieldset>
            <legend class="label">Jenis transaksi</legend>
            <div class="grid grid-cols-2 gap-3">
                                    <label class="flex cursor-pointer items-center gap-3 rounded-lg border border-slate-300 px-4 py-3 text-sm font-medium has-[:checked]:border-brand-600 has-[:checked]:bg-brand-50 has-[:checked]:text-brand-800">

                        <input type="radio" name="type" value="out" class="text-brand-600 focus:ring-brand-500" > Barang keluar
                    </label>
                            </div>
        </fieldset>

        <div>
            <label class="label" for="item_id">Barang</label>
            <select id="item_id" name="item_id" class="input" required>
                <option value="">Pilih barang</option>
                                    <option value="17" data-stock="163" data-unit="galon" >BRG-0017 — Air Mineral Galon</option>
                                    <option value="9" data-stock="0" data-unit="pak" >BRG-0009 — Baterai AA</option>
                                    <option value="16" data-stock="221" data-unit="kg" >BRG-0016 — Gula Pasir</option>
                                    <option value="8" data-stock="47" data-unit="pcs" >BRG-0008 — Kabel HDMI</option>
                                    <option value="1" data-stock="162" data-unit="rim" >BRG-0001 — Kertas A4 80gr</option>
                                    <option value="7" data-stock="175" data-unit="unit" >BRG-0007 — Keyboard</option>
                                    <option value="15" data-stock="0" data-unit="box" >BRG-0015 — Kopi Sachet</option>
                                    <option value="10" data-stock="49" data-unit="unit" >BRG-0010 — Kursi Kantor</option>
                                    <option value="4" data-stock="422" data-unit="pcs" >BRG-0004 — Map Folder</option>
                                    <option value="11" data-stock="20" data-unit="unit" >BRG-0011 — Meja Lipat</option>
                                    <option value="6" data-stock="67" data-unit="unit" >BRG-0006 — Mouse Wireless</option>
                                    <option value="14" data-stock="67" data-unit="botol" >BRG-0014 — Pembersih Lantai</option>
                                    <option value="2" data-stock="629" data-unit="pcs" >BRG-0002 — Pulpen Hitam</option>
                                    <option value="13" data-stock="175" data-unit="botol" >BRG-0013 — Sabun Cuci Tangan</option>
                                    <option value="3" data-stock="14" data-unit="pcs" >BRG-0003 — Spidol Whiteboard</option>
                                    <option value="5" data-stock="113" data-unit="box" >BRG-0005 — Staples</option>
                                    <option value="12" data-stock="293" data-unit="pak" >BRG-0012 — Tisu Roll</option>
                            </select>
            <p id="stockInfo" class="mt-1.5 text-xs text-slate-500"></p>
                    </div>

        <div class="grid gap-5 sm:grid-cols-2">
            <div>
                <label class="label" for="quantity">Jumlah</label>
                <input id="quantity" name="quantity" type="number" min="1" class="input" required value="">
                            </div>
            <div>
                <label class="label" for="movement_date">Tanggal</label>
                <input id="movement_date" name="movement_date" type="date" max="2026-11-01" class="input" required value="2026-11-01">
                            </div>
        </div>

        <div class="grid gap-5 sm:grid-cols-2">
            <div>
                <label class="label" for="party" id="partyLabel">Pemasok</label>
                <input id="party" name="party" class="input" maxlength="150" value="">
            </div>
            <div>
                <label class="label" for="reference">No. dokumen / referensi</label>
                <input id="reference" name="reference" class="input" maxlength="100" value="">
            </div>
        </div>

        <div>
            <label class="label" for="note">Catatan <span class="font-normal text-slate-400">(opsional)</span></label>
            <input id="note" name="note" class="input" maxlength="255" value="">
        </div>

        <div class="flex justify-end gap-3 pt-2">
            <a href="riwayat.html" class="btn-light">Batal</a>
            <button class="btn-primary">Simpan transaksi</button>
        </div>

<script>
    const sb = document.getElementById('sidebar'), bd = document.getElementById('backdrop');
    const toggle = () => { sb.classList.toggle('-translate-x-full'); bd.classList.toggle('hidden'); };
    document.getElementById('menuBtn')?.addEventListener('click', toggle);
    bd.addEventListener('click', toggle);
</script>
<script>
const sel = document.getElementById('item_id'), info = document.getElementById('stockInfo'),
      qty = document.getElementById('quantity'), partyLabel = document.getElementById('partyLabel');
const curType = () => document.querySelector('input[name=type]:checked').value;

function refresh() {
    const o = sel.selectedOptions[0];
    info.textContent = o && o.value ? 'Stok saat ini: ' + o.dataset.stock + ' ' + o.dataset.unit : '';
    partyLabel.textContent = curType() === 'in' ? 'Pemasok' : 'Penerima / unit kerja';
    if (curType() === 'out' && o && o.value) qty.max = o.dataset.stock; else qty.removeAttribute('max');
}
sel.addEventListener('change', refresh);
document.querySelectorAll('input[name=type]').forEach(r => r.addEventListener('change', refresh));
refresh();
</script>
<style>.demo-badge{position:fixed;right:12px;bottom:12px;z-index:99999;background:rgba(15,23,42,.88);color:#fff;font:600 12px/1 Inter,system-ui,sans-serif;padding:8px 12px;border-radius:999px;pointer-events:none}</style>
<div class="demo-badge">Mode demo &middot; data contoh</div>
<script>
document.addEventListener('submit',function(e){
  e.preventDefault();
  var nav=e.target.getAttribute('data-nav');
  if(nav){location.href=nav;return;}
  alert('Ini versi demo statis. Perubahan data tidak disimpan.');
},true);
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a[href="#demo-off"]');
  if(a){e.preventDefault();alert('Fitur ini dinonaktifkan pada versi demo statis.');}
});
</script>
